{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}My Blog{% endblock %}</title>

    <link href="{% static 'css/blog.css' %}" rel="stylesheet">
    <script src="{% static 'js/image-trail.js' %}" defer></script>
</head>
<body class="{% block body_class %}{% endblock %}">

<div
    id="image-trail"
    data-image-base="{% static 'images/trail/' %}"
    data-image-count="57"
    data-image-extension="jpg"
    aria-hidden="true"
></div>


    <header class="site-header">
        <a href="{% url 'home' %}" class="site-logo">My Blog.</a>

        <nav class="navigation">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'blogapp:post_list' %}">Blog</a>
            <a href="{% url 'about' %}">About</a>

                {% if user.is_authenticated %}

        <span class="nav-user">
            {{ user.username }}
        </span>

        <form
            method="post"
            action="{% url 'logout' %}"
            class="nav-auth-form"
        >
            {% csrf_token %}
            <button type="submit" class="nav-logout">
                Log out
            </button>
        </form>

    {% else %}

        <a href="{% url 'login' %}" class="nav-login">
            Login
        </a>

        <a href="{% url 'register' %}" class="nav-register">
            Register
        </a>

    {% endif %}
        </nav>
    </header>

    <main id="content">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="site-footer">
        <p>Books, ideas & technology.</p>
        <p>🌚 My Blog</p>
    </footer>

</body>
</html>
